    <div class="s3-container">

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        const browserWindow = document.querySelector('.s3-browser-window');
        const progressFill = document.querySelector('.s3-progress-fill');
        const pill1 = document.querySelector('.s3-pill-1');
        const pill2 = document.querySelector('.s3-pill-2');
        const pill3 = document.querySelector('.s3-pill-3');
        const reviewOverlay = document.querySelector('.s3-review-overlay');
        const badgeStamp = document.querySelector('.s3-badge-stamp');

        // Smooth 3D tilt camera move
        tl.to(browserWindow, {
          rotateX: 4,
          rotateY: 2,
          scale: 1.0,
          duration: 4.8,
          ease: 'power1.inOut'
        }, 0);

        // Progress bar glowing fill
        tl.to(progressFill, { width: '100%', duration: 4.0, ease: 'power2.out' }, 0.4);

        // Pop up three sequential status pills
        tl.to(pill1, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 0.8);
        tl.to(pill2, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 2.0);
        tl.to(pill3, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: 'back.out(1.5)' }, 3.2);

        // At 5.0s (abs 23s): Switch to A-Roll review
        tl.to(reviewOverlay, { opacity: 1, duration: 0.5, ease: 'power2.out' }, 5.0);

        // At 6.0s (abs 24s): Emerald verification badge stamps down with crisp lock-in
        tl.to(badgeStamp, {
          opacity: 1,
          scale: 1.0,
          rotate: -2,
          duration: 0.5,
          ease: 'back.out(1.8)'
        }, 6.0);

        // Exit at 9.7s
        tl.to([reviewOverlay], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 9.7);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene-3'] = tl;
      })();
