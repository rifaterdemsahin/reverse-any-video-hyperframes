    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        const panelLeft = document.querySelector('.s2-panel-left');
        const panelRight = document.querySelector('.s2-panel-right');
        const glitchBorder = document.querySelector('.s2-glitch-border');
        const rightCard = document.querySelector('.s2-right-card');

        // Scene start at 0s (absolute 8s): Left side enters with error thud
        tl.fromTo(panelLeft, { x: -80, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: 'power3.out' }, 0);

        // Glitch border flicker during 0s - 5s
        tl.to(glitchBorder, { opacity: 0.2, repeat: 5, yoyo: true, duration: 0.4 }, 0.5);

        // At 5s (absolute 13s): Right side wipes in cleanly with chime
        tl.to(panelRight, { opacity: 1, x: 0, duration: 0.8, ease: 'power3.out' }, 5.0);
        tl.fromTo(rightCard, { scale: 0.92 }, { scale: 1, duration: 0.8, ease: 'back.out(1.5)' }, 5.0);

        // Scene exit at 9.7s (absolute 17.7s)
        tl.to([panelLeft, panelRight], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 9.7);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene-2'] = tl;
      })();
