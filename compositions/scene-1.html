    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        const videoWrap = document.querySelector('.s1-video-wrap');
        const titleCard = document.querySelector('.s1-title-card');
        const cardRight = document.querySelector('.s1-card-right');
        const transferLine = document.querySelector('.s1-transfer-line');
        const pulseLine = document.querySelector('.s1-pulse-line');

        // Subtle punch-in zoom 100% -> 108% over 8 seconds
        tl.fromTo(videoWrap, { scale: 1.0 }, { scale: 1.08, duration: 8.0, ease: 'none' }, 0);

        // Kinetic Title Card pop-in at 0.3s
        tl.to(titleCard, { opacity: 1, y: 0, scale: 1, duration: 0.9, ease: 'back.out(1.4)' }, 0.3);

        // Comparison card swooshes in from right at 2.0s (synced to SFX whoosh)
        tl.to(cardRight, { opacity: 1, x: 0, scale: 1, duration: 0.8, ease: 'power3.out' }, 2.0);

        // Glowing transfer lines & pulse animations
        tl.to(pulseLine, { scaleX: 1, duration: 0.6, ease: 'power2.out' }, 2.6);
        tl.to(transferLine, { scaleY: 1, duration: 0.8, ease: 'elastic.out(1, 0.6)' }, 2.9);

        // Exit transition to Scene 2 at 7.7s
        tl.to([titleCard, cardRight], { opacity: 0, scale: 0.96, duration: 0.3, ease: 'power2.in' }, 7.7);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene-1'] = tl;
      })();
