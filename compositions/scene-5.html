    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });
        const leftText = document.querySelector('.s5-left-text');
        const card = document.querySelector('.s5-pricing-card');
        const coin = document.querySelector('.s5-coin');

        // Left text enters at 0.4s

        // 3D Coin drops in and lands with bounce (synced to coin clink SFX at 3.0s)

          opacity: 1,
          y: 0,
          rotateY: 0,
          scale: 1,
          duration: 0.8,
          ease: 'bounce.out'
        }, 3.0);

        // Exit at 11.7s
        tl.to([leftText, card], { opacity: 0, duration: 0.3, ease: 'power2.in' }, 11.7);

        window.__timelines = window.__timelines || {};
        window.__timelines['scene-5'] = tl;
